[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-price-tracker"
version = "0.1.0"
description = "A personal Telegram price tracker for Shopee Singapore"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "playwright==1.63.0", "python-dotenv==1.2.4"]

[project.scripts]
shopee-tracker = "shopee_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/shopee_tracker"]
